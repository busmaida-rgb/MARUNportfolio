<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/list.css">
    <script src="./js/header.js" defer></script>
    <script src="./js/new-product.js"></script>
    <script src="./js/new-product-control.js" defer></script>
    <script src="./js/parameter.js"></script>
    <title>MARUN - 취업용 포트폴리오</title>

    <meta name="description" content="MARUN은 오래 머물고 싶은 공간을 위한 가구와 라이프스타일을 제안합니다. 따뜻하고 자연스러운 디자인으로 일상에 편안한 균형을 더해보세요." />
    <meta name="keywords" content="MARUN, 마룬, 가구, 인테리어 가구, 디자인 가구, 라이프스타일, 거실 가구, 침실 가구, 다이닝 가구" />
    <meta name="author" content="MARUN" />
    <meta name="robots" content="index, follow" />

    <!-- 대표 URL -->
    <link rel="canonical" href="https://도메인주소.com/" />

    <!-- Open Graph: 카카오톡, 페이스북 등 공유 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MARUN" />
    <meta property="og:title" content="MARUN | 공간에 편안한 균형을 더하는 가구" />
    <meta property="og:description" content="오래 머물고 싶은 공간을 위한 가구와 라이프스타일을 만나보세요." />
    <meta property="og:url" content="https://도메인주소.com/" />
    <meta property="og:image" content="https://도메인주소.com/img/slide2-pad.jpg" />
    <meta property="og:image:alt" content="MARUN 가구와 인테리어 공간" />
    <meta property="og:locale" content="ko_KR" />

    <!-- 파비콘 -->
    <link rel="icon" type="image/png" href="./img/favicon.png" />

    <!-- 공통 헤더/푸터 파일 연결 -->
    <script src="./js/include.js" defer></script>
    <script src="./js/header.js" defer></script>
</head>

<body>
    <div id="header-wrap">
        <!-- header.html 파일의 내용이 들어오는 영역 -->
    </div>

    <main>
        <div class="hero-banner">
            <a href="#">
                <picture>
                    <source media="(max-width:768px)" srcset="./img/banner-new-mo.jpg">
                    <source media="(max-width:1024px)" srcset="./img/banner-new-pad.jpg">
                    <img src="./img/banner-new-pc.jpg" alt="MARUN 쇼핑몰 신상품 배너">
                </picture>
            </a>
        </div>

        <section class="con1">
            <div class="common-frame">
                <div class="title">
                    <h1>FRESHLY CURATED</h1>
                    <span></span>
                    <p>일상에 새로운 균형을 더하는 이번 시즌의 셀렉션</p>
                </div>
                <ul class="new-product grid-list">
                    <li>
                        <a href="#">
                            
                        </a>
                    </li>
                </ul>
            </div>
        </section>
    </main>

    <div id="footer-wrap">
        <!-- footer.html 파일의 내용이 들어오는 영역 -->
    </div>
</body>

</html>
